# One stack per company, run under its own Compose project name, so nothing is shared:
# own PostgreSQL, own Redis, own object store, own secrets, own named volumes.
x-app: &app
  image: ghcr.io/avaniecocare/lims:${LIMS_VERSION:?set in versions.env}
  restart: unless-stopped
  env_file:
    - ${CLIENT_DIR}/company.env
    - ${CLIENT_DIR}/generated.env
  volumes:
    - ${CLIENT_DIR}/branding:/branding:ro
  networks: [internal]

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lims_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?}
      POSTGRES_DB: lims
      LIMS_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ${DEPLOY_ROOT}/compose/db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [internal]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U lims_owner -d lims'], interval: 5s, timeout: 3s, retries: 30 }

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: ['redisdata:/data']
    networks: [internal]
    healthcheck: { test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'], interval: 5s, timeout: 3s, retries: 30 }
    environment: { REDIS_PASSWORD: '${REDIS_PASSWORD:?}' }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes: ['miniodata:/data']
    networks: [internal, proxy]
    healthcheck: { test: ['CMD', 'mc', 'ready', 'local'], interval: 5s, timeout: 3s, retries: 30 }

  # Migrations run as the table owner; the app itself connects as a role that cannot alter tables.
  migrate:
    <<: *app
    restart: 'no'
    command: ['sh', '-c', 'DATABASE_URL="$$MIGRATION_DATABASE_URL" npx prisma migrate deploy']
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ['node', 'dist/main.js', 'api']
    networks: [internal, proxy]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    <<: *app
    command: ['node', 'dist/main.js', 'worker']
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  ui:
    image: ghcr.io/avaniecocare/lims-ui:${LIMS_UI_VERSION:?set in versions.env}
    restart: unless-stopped
    environment:
      API_URL: https://${API_DOMAIN:?}
      STORAGE_ORIGIN: https://${FILES_DOMAIN:?}
    networks: [proxy]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  internal: {}
  proxy:
    external: true
    name: lims-proxy
