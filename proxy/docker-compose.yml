# One reverse proxy per server, in front of every company on it. Caddy obtains and renews TLS
# certificates automatically. Sites are generated into sites/ by scripts/proxy-sync.sh.
name: lims-proxy
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PROXY_SITES_DIR:?}:/etc/caddy/sites:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [lims-proxy]
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddydata:
  caddyconfig:
networks:
  lims-proxy:
    external: true
