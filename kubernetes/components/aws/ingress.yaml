apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lims
  annotations:
    alb.ingress.kubernetes.io/group.name: lims
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # The help assistant streams answers for up to 45 seconds. Made-up headers are dropped before the app sees them.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120,routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=20
spec:
  ingressClassName: alb
  rules:
    - host: APP_DOMAIN
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: ui, port: { name: http } } } }] }
    - host: API_DOMAIN
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }] }
