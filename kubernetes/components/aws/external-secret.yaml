# External Secrets copies one Secrets Manager secret per company. The overlay names it. The store may read only lims/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: lims-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: lims-secrets, deletionPolicy: Retain }
  dataFrom: [{ extract: { key: COMPANY_SECRET } }]
---
# The table owner's connection, for the migrate Job alone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: lims-migrate }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: lims-migrate, deletionPolicy: Retain }
  dataFrom: [{ extract: { key: COMPANY_MIGRATE_SECRET } }]
