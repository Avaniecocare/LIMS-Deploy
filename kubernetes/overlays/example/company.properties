# Settings only. Secrets are in AWS Secrets Manager: see ../../README.md.
NODE_ENV=production
PORT=3000
OPS_PORT=9464
LOG_LEVEL=info
BRAND_NAME=LIMS
APP_DOMAIN=lims.example.com
API_DOMAIN=api.lims.example.com
FRONTEND_ORIGIN=https://lims.example.com
PUBLIC_API_URL=https://api.lims.example.com
COOKIE_SECURE=true
TRUST_PROXY=1
S3_ENDPOINT=https://s3.ap-south-1.amazonaws.com
S3_REGION=ap-south-1
S3_BUCKET=lims-example-files
S3_FORCE_PATH_STYLE=false
STORAGE_ORIGIN=https://lims-example-files.s3.ap-south-1.amazonaws.com
NODE_EXTRA_CA_CERTS=/etc/rds-ca/global-bundle.pem
SMTP_HOST=email-smtp.ap-south-1.amazonaws.com
SMTP_PORT=587
SMTP_SECURE=false
SMTP_FROM=lims@example.com
HELP_INDEX_URL=http://ui/help/help-index.json
VPC_PUBLIC_CIDR=10.20.0.0/20
VPC_DATA_CIDR=10.20.32.0/20
COMPANY_SECRET=lims/prod/example/app
COMPANY_MIGRATE_SECRET=lims/prod/example/migrate
