# One company's mistake or load cannot take the cluster from the others.
apiVersion: v1
kind: ResourceQuota
metadata: { name: company }
spec:
  hard: { requests.cpu: '4', requests.memory: 8Gi, limits.memory: 14Gi, pods: '30', persistentvolumeclaims: '4', services.loadbalancers: '0', services.nodeports: '0' }
---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults }
spec:
  limits: [{ type: Container, default: { memory: 256Mi }, defaultRequest: { cpu: 25m, memory: 64Mi } }]
