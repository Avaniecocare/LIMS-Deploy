# The app's identity. On EKS, Pod Identity gives `lims` this company's own bucket and nothing else. It may not call the
# Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata: { name: lims }
automountServiceAccountToken: false
---
# For what needs no AWS access at all: the screens, the cache, and migrations.
apiVersion: v1
kind: ServiceAccount
metadata: { name: lims-plain }
automountServiceAccountToken: false
