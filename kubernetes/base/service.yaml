apiVersion: v1
kind: Service
metadata: { name: api }
spec: { selector: { app: api }, ports: [{ name: http, port: 80, targetPort: http }] }
---
apiVersion: v1
kind: Service
metadata: { name: ui }
spec: { selector: { app: ui }, ports: [{ name: http, port: 80, targetPort: http }] }
---
# For monitoring only: no ingress leads here, and the network policy lets only the monitoring namespace in.
apiVersion: v1
kind: Service
metadata: { name: ops, labels: { lims.example/ops: 'true' } }
spec:
  clusterIP: None
  selector: { lims.example/ops: 'true' }
  ports: [{ name: ops, port: 9464, targetPort: ops }]
