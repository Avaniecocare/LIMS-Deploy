# External Secrets reads lims/prod/* with its own Pod Identity role. Only namespaces that hold a company may use it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: aws-secrets-manager }
spec:
  conditions: [{ namespaceRegexes: ['^lims-[a-z0-9-]+$'] }]
  provider: { aws: { service: SecretsManager, region: ap-south-1 } }
