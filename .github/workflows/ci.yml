name: CI
on:
  push:
    branches: [main, 'build/**']
  # pull_request (never pull_request_target) gives fork PRs no secrets.
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # The gitleaks CLI itself (MIT), not gitleaks-action, which needs a paid licence on org repos.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Shellcheck
        run: shellcheck -x -P SCRIPTDIR scripts/*.sh scripts/lib/*.sh compose/*.sh docker-compose/*.sh kubernetes/*.sh terraform/server/files/*.sh
      - name: Settings reach the app unchanged
        run: scripts/env-check.sh
      - name: Only template and fictional examples under clients/
        run: |
          bad="$(git ls-files clients | grep -vE '^clients/(_template|example-[a-z]+)/' || true)"
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
          if git ls-files | grep -E '(^|/)(company|deployment|secrets|generated|migrate|versions)\.env$'; then exit 1; fi
      - name: Compose files parse
        # A throwaway company folder built from the fictional example, so every env_file exists
        # and every required variable is set. Any error fails the job.
        run: |
          d="$RUNNER_TEMP/client"
          mkdir -p "$d"
          cp -R clients/example-bluepeak/branding "$d/branding"
          for f in company deployment versions; do cp "clients/example-bluepeak/$f.env.example" "$d/$f.env"; done
          sed -i 's#^S3_IMAGE=.*#S3_IMAGE="lims-test-s3:local"#' "$d/deployment.env"
          printf 'POSTGRES_OWNER_PASSWORD="x"\nPOSTGRES_APP_PASSWORD="x"\nREDIS_PASSWORD="x"\nS3_ACCESS_KEY="x"\nS3_SECRET_KEY="x"\n' > "$d/secrets.env"
          : > "$d/generated.env"
          : > "$d/migrate.env"
          CLIENT_DIR="$d" DEPLOY_ROOT="$PWD" docker compose -p lims-bluepeak -f compose/docker-compose.yml \
            --env-file "$d/secrets.env" --env-file "$d/versions.env" --env-file "$d/deployment.env" config -q
          PROXY_SITES_DIR="$RUNNER_TEMP/sites" docker compose -f proxy/docker-compose.yml config -q
          LIMS_VERSION=x LIMS_UI_VERSION=y docker compose -f docker-compose/docker-compose.yml --env-file docker-compose/.env.example config -q
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Format, validate, and plan against mocked AWS
        run: |
          for stack in account server prod; do
            tf() { docker run --rm -v "$PWD/terraform:/w" -w "/w/$stack" hashicorp/terraform:1.13.5 "$@"; }
            tf fmt -check -recursive ..
            tf init -backend=false
            tf validate
            tf test
          done
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Manifests render and match their schemas
        run: |
          for o in example local; do
            kubectl kustomize "kubernetes/overlays/$o" | docker run --rm -i ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -strict -summary -ignore-missing-schemas -kubernetes-version 1.36.0
          done
      - name: Alert rules
        run: docker run --rm -v "$PWD/monitoring:/w:ro" -w /w --entrypoint promtool prom/prometheus:v3.7.0 test rules alerts-test.yaml
  white-label:
    # Runs once images exist; set repository variables LIMS_VERSION and LIMS_UI_VERSION.
    if: github.event_name == 'push' && vars.LIMS_VERSION != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The lims and lims-ui images are private on GHCR. Grant this repository read access in each
      # package's settings (Manage Actions access) so GITHUB_TOKEN can pull them.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/white-label-check.sh
        env:
          LIMS_VERSION: ${{ vars.LIMS_VERSION }}
          LIMS_UI_VERSION: ${{ vars.LIMS_UI_VERSION }}
