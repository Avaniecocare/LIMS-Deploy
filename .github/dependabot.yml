version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # Base images named literally in the Compose files (postgres, redis, caddy) and the test store.
  - package-ecosystem: docker-compose
    directories: [/compose, /proxy]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /compose/test-s3
    schedule: { interval: weekly }
